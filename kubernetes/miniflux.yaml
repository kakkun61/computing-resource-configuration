apiVersion: v1
kind: Namespace
metadata:
  name: miniflux
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: miniflux
  namespace: miniflux
spec:
  rules:
    - host: miniflux.kakkun61.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: miniflux
                port:
                  number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: miniflux
  namespace: miniflux
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: miniflux
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
  namespace: miniflux
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: miniflux
  template:
    metadata:
      labels:
        app: miniflux
    spec:
      containers:
        - name: miniflux
          image: ghcr.io/miniflux/miniflux:2.2.18
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: CREATE_ADMIN
              value: "1"
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: service
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: service
                  key: password
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database
                  key: password
            - name: DATABASE_URL
              value: postgres://miniflux:$(DATABASE_PASSWORD)@database-rw/miniflux?sslmode=disable
            - name: RUN_MIGRATIONS
              value: "1"
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: database
  namespace: miniflux
spec:
  instances: 1
  storage:
    storageClass: local-path
    size: 1Gi
  affinity:
    nodeSelector:
      kubernetes.io/hostname: gmk
  bootstrap:
    initdb:
      database: miniflux
      owner: miniflux
      secret:
        name: database
