apiVersion: v1
kind: Namespace
metadata:
  name: hollo-international-fixed-calendar
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: job
  namespace: hollo-international-fixed-calendar
spec:
  schedule: "0 7 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: hollo-international-fixed-calendar
              image: ghcr.io/kakkun61/hollo-international-fixed-calendar:release-hollo-international-fixed-calendar-2026-09-30-01
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: env
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
