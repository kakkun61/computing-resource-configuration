apiVersion: v1
kind: Namespace
metadata:
  name: immich
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Ti
  storageClassName: nfs-client
---
# /mnt/usb-raid/photos を /external-library にマウントするための PersistentVolume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-external-library-pv
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-client
  nfs:
    path: /mnt/usb-raid/photos
    server: gmk.local.kakkun61.com
---
# /mnt/usb-raid/photos を /external-library にマウントするための PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-external-library
  namespace: immich
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Ti
  storageClassName: nfs-client
  volumeName: immich-external-library-pv
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: database
  namespace: immich
spec:
  instances: 1
  storage:
    storageClass: local-path
    size: 1Gi
  affinity:
    nodeSelector:
      kubernetes.io/hostname: gmk
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.9-0.4.3
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: database-auth
      postInitApplicationSQL:
        # Commands based on: https://immich.app/docs/administration/postgres-standalone/#without-superuser-permission
        - CREATE EXTENSION vchord CASCADE;
        - CREATE EXTENSION earthdistance CASCADE;
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-backup
---
# 参考：https://cloudnative-pg.io/plugin-barman-cloud/docs/usage/
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: immich-backup
  namespace: immich
spec:
  configuration:
    destinationPath: s3://immich-369113523265-ap-northeast-3-an/postgres-cnpg
    s3Credentials:
      accessKeyId:
        name: immich-backup-s3
        key: access-key-id
      secretAccessKey:
        name: immich-backup-s3
        key: secret-access-key
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      - name: AWS_DEFAULT_REGION
        value: ap-northeast-3
  retentionPolicy: "90d"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: database-backup
  namespace: immich
spec:
  schedule: "0 0 3 * * *" # 毎日 03:00
  backupOwnerReference: self
  cluster:
    name: database
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: immich-upload-size
  namespace: immich
spec:
  # 参考：https://baerentsen.space/immich-issue/
  buffering:
    maxRequestBodyBytes: 0 # 制限を無効化
    maxResponseBodyBytes: 0
    memRequestBodyBytes: 20971520
    memResponseBodyBytes: 20971520
    retryExpression: "IsNetworkError() && Attempts() < 2"
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: immich
  namespace: kube-system
spec:
  chart: oci://ghcr.io/immich-app/immich-charts/immich
  version: "0.13.1"
  targetNamespace: immich
  valuesContent: |-
